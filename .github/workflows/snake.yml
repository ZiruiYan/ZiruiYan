name: Generate contribution snake

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish SVG animations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#58CC02
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58CC02

      - name: Publish generated animations
        env:
          SNAKE_OUTPUT_BRANCH: zirui/snake-output
        run: |
          animation_dir="$(mktemp -d)"
          cp dist/github-snake.svg dist/github-snake-dark.svg "$animation_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$SNAKE_OUTPUT_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$SNAKE_OUTPUT_BRANCH"
            git switch --detach FETCH_HEAD
          else
            git switch --orphan "$SNAKE_OUTPUT_BRANCH"
          fi

          cp "$animation_dir/github-snake.svg" "$animation_dir/github-snake-dark.svg" .
          git add github-snake.svg github-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Animations are already up to date."
            exit 0
          fi

          git commit -m "Update contribution snake"
          git push origin HEAD:"$SNAKE_OUTPUT_BRANCH"
